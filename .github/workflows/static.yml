# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage the published site
        # The whole repository used to go up, so anything committed at the root
        # was published the moment it landed on main — drafts included. This is
        # an explicit list rather than a glob with exceptions: adding a file to
        # the repository should not publish it, and publishing one should be a
        # visible edit here.
        run: |
          mkdir -p _site
          cp article.html article.ru.html genesis-animation.html _site/
          cp article.md article.ru.md _site/
          cp HIVE_CONSTITUTION.md GRIMOIRE.md codons.md _site/
          cp cover.md journey-diagram.md MCP_DRAFT.md gardener.md _site/
          cp README.md CONTRIBUTING.md _site/
          ls -1 _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
