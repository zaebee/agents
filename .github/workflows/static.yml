# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage the published site
        # Everything except a short deny list. The first attempt at this was an
        # allow list of root files, which was wrong twice over: it silently
        # dropped every subdirectory the site used to serve — dna-core/,
        # genesis-engine/, hive/ — and, running under `bash -e`, it turned any
        # rename of a listed file into a failed deploy that froze the whole site
        # on its previous build.
        #
        # Denying is the weaker guarantee: a new private file has to be added
        # below or it goes public. That is the same rule the repository had
        # before, it is what CLAUDE.md documents, and it fails in the direction
        # that is visible rather than the one that 404s quietly.
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'drafts' \
            --exclude 'CLAUDE.md'
          echo "Published tree:"
          find _site -maxdepth 2 -not -path '_site' | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
